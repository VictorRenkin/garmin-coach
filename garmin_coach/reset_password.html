<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe — Motionest</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100d;color:#fff;font-family:system-ui}.card{width:min(420px,calc(100% - 40px));padding:28px;border:1px solid #34443e;border-radius:20px;background:#0b1a15}h1{margin-top:0}label{display:grid;gap:7px;margin-top:16px;font-size:13px}input{padding:13px;border:1px solid #45564f;border-radius:10px;background:#10231c;color:#fff}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#c9f457;color:#111a0b;font-weight:800}.status{color:#86dfc2;font-size:13px}.error{color:#ff9ba4}a{color:#c9f457}</style></head><body><main class="card"><h1>Nouveau mot de passe</h1><p>Choisis un mot de passe d’au moins 10 caractères.</p><form id="reset"><label>Nouveau mot de passe<input name="password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required></label><label>Confirme le mot de passe<input name="passwordConfirm" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required></label><button>Modifier le mot de passe</button><p class="status" id="status" role="status"></p></form><a href="/">Retour à Motionest</a></main><script>const form=document.getElementById('reset'),statusBox=document.getElementById('status'),token=new URLSearchParams(location.search).get('token')||'';form.addEventListener('submit',async event=>{event.preventDefault();const values=new FormData(form);if(values.get('password')!==values.get('passwordConfirm')){statusBox.textContent='Les deux mots de passe ne correspondent pas.';statusBox.className='status error';return}const response=await fetch('/api/account/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:values.get('password'),passwordConfirm:values.get('passwordConfirm')})}),data=await response.json();statusBox.textContent=data.message;statusBox.className=response.ok?'status':'status error';if(response.ok)setTimeout(()=>location.assign(data.redirect||'/'),900)})</script></body></html>
